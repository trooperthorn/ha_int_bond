# Runs the pytest suite on every push and pull request. release.yml calls this
# workflow so the same jobs gate every GitHub Release.
#
# No frontend in this repository, so there is no bundle-drift job.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # The released HA pytest fixture package currently declares the 2026.9
      # beta. Install its fixtures first, then enforce the stable HA runtime
      # pinned by requirements_test.txt.
      - name: Install the test harness
        run: |
          pip install pytest-homeassistant-custom-component==0.13.362
          pip install -r requirements_test.txt
      - name: Verify runtime dependency versions
        run: python -c "from importlib.metadata import version; assert version('homeassistant') == '2026.9.0'"
      - name: Run the suite
        run: pytest tests/ -q
