blueprint:
  name: "Bond Pro: Evening switch schedule"
  description: >-
    Turn a Bond-controlled switch (e.g. holiday lights on an RF outlet) on at
    sunset and off at a fixed time, optionally only between two dates.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_int_bond/blob/main/blueprints/automation/bond_pro/evening_switch_schedule.yaml
  input:
    switch_entity:
      name: Switch
      description: The Bond switch to schedule.
      selector:
        entity:
          domain: switch
    sunset_offset:
      name: Sunset offset
      description: Offset relative to sunset for turning on.
      default: "-00:15:00"
      selector:
        text:
    off_time:
      name: Off time
      description: Time to turn the switch off.
      default: "23:30:00"
      selector:
        time:
    start_date:
      name: First day (MM-DD)
      description: Only run on/after this date each year (empty = all year).
      default: "11-25"
      selector:
        text:
    end_date:
      name: Last day (MM-DD)
      description: Only run on/before this date each year (empty = all year).
      default: "01-06"
      selector:
        text:

triggers:
  - trigger: sun
    event: sunset
    offset: !input sunset_offset
    id: "on"
  - trigger: time
    at: !input off_time
    id: "off"

conditions:
  - condition: template
    value_template: >-
      {% set start = start_date %}{% set end = end_date %}
      {% if not start or not end %}true{% else %}
      {% set today = now().strftime('%m-%d') %}
      {% if start <= end %}{{ start <= today <= end }}
      {% else %}{{ today >= start or today <= end }}{% endif %}
      {% endif %}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input switch_entity
      - conditions:
          - condition: trigger
            id: "off"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input switch_entity

variables:
  start_date: !input start_date
  end_date: !input end_date

mode: single
