rules:
  # Bronze
  action-setup:
    status: done
    comment: Hub services registered in async_setup_services; entity services per platform.
  appropriate-polling:
    status: done
    comment: BPUP push primary; single hub-level fallback coordinator (30s down / 5min alive).
  brands: todo
  common-modules:
    status: done
    comment: coordinator.py, entity.py, models.py, utils.py.
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: 401 during setup raises ConfigEntryAuthFailed; reauth step collects a new token.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: Devices added to the hub require a reload today.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Per-device RF frequency sensors are disabled by default.
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices:
    status: done
    comment: async_remove_config_entry_device allows removal of devices the hub no longer reports.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: Requires typed models in the bond-async fork; planned.
